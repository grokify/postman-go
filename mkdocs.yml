site_name: postman-go
site_description: Go SDK for the Postman API
site_url: https://grokify.github.io/postman-go/
repo_url: https://github.com/grokify/postman-go
repo_name: grokify/postman-go

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guides:
      - Authentication: guides/authentication.md
      - Error Handling: guides/errors.md
      - Rate Limiting: guides/rate-limiting.md
  - API Reference: api-reference.html
  - Services:
      - Analytics: services/analytics.md
      - API Security: services/apisecurity.md
      - Audit Logs: services/auditlogs.md
      - Billing: services/billing.md
      - Collection Access Keys: services/collectionaccesskeys.md
      - Collection Folders: services/collectionfolders.md
      - Collection Items: services/collectionitems.md
      - Collection Requests: services/collectionrequests.md
      - Collection Responses: services/collectionresponses.md
      - Collections: services/collections.md
      - Comments: services/comments.md
      - Components: services/components.md
      - Environments: services/environments.md
      - Groups: services/groups.md
      - Import: services/imports.md
      - Mocks: services/mocks.md
      - Monitors: services/monitors.md
      - OAuth 2.0: services/oauth2.md
      - Postbot: services/postbot.md
      - Private API Network: services/privateapinetwork.md
      - Pull Requests: services/pullrequests.md
      - SDK Generation: services/sdkgen.md
      - Search: services/search.md
      - Secret Scanner: services/secretscanner.md
      - Service Accounts: services/serviceaccounts.md
      - Specs: services/specs.md
      - Tags: services/tags.md
      - Teams: services/teams.md
      - Users: services/users.md
      - Webhooks: services/webhooks.md
      - Workspaces: services/workspaces.md
  - Releases:
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/postman-go
